<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thread — cockpit</title>
<style>
  /* =========================================================
     Thread — v2 cockpit
     A present-tense planner. Home is TODAY, anchored to the current
     time. Recurring meetings are threads: distil one instance's
     transcript and the next instance opens knowing where you left off
     and what you still owe. Not the v1 pastels — a focused work surface.
     ========================================================= */
  :root {
    --bg: #f4f4f3; --surface: #ffffff; --ink: #17171c; --ink-2: #5c5c68; --ink-3: #8a8a96;
    --line: #e7e7ea; --line-2: #efeff1;
    --accent: #4f46e5; --accent-soft: #eef0fe; --accent-ink: #4f46e5;
    --owe: #b45309; --owe-soft: #fdf3e7; --done: #15803d; --done-soft: #e8f5ec;
    --now: #e5484d; --now-soft: #fdecec;
    --r: 14px; --r-sm: 9px;
    --sh: 0 1px 2px rgba(20,20,30,.04), 0 6px 22px rgba(20,20,30,.06);
    --sh-lg: 0 10px 40px rgba(20,20,30,.16);
    --maxw: 640px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101012; --surface: #1a1a1e; --ink: #f2f2f4; --ink-2: #aeaeb8; --ink-3: #787884;
      --line: #2a2a30; --line-2: #212127;
      --accent: #8b87f5; --accent-soft: #23233a; --accent-ink: #a7a3ff;
      --owe: #e0a15a; --owe-soft: #332a1d; --done: #6cc38c; --done-soft: #1e2a22;
      --now: #ff6b6f; --now-soft: #331e1f;
      --sh: 0 1px 2px rgba(0,0,0,.3), 0 8px 26px rgba(0,0,0,.35);
      --sh-lg: 0 14px 48px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(18px, env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: var(--maxw); margin: 0 auto; }
  [hidden] { display: none !important; }
  button { font-family: inherit; }

  /* ---- Header / brief ---- */
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand h1 { font-size: 21px; font-weight: 800; letter-spacing: -.02em; margin: 0; }
  .brand .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .brand .bell {
    margin-left: auto; border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
    width: 32px; height: 32px; cursor: pointer; font-size: 14px; line-height: 1; filter: grayscale(1) opacity(.55);
  }
  .brand .bell:hover { border-color: var(--ink-3); }
  .brand .bell.on { filter: none; border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); background: var(--accent-soft); }
  .brand .tag { font-size: 12.5px; color: var(--ink-3); margin-left: 10px; font-variant-numeric: tabular-nums; }

  /* ---- Next-up nudge ---- */
  .nudge {
    position: sticky; top: 8px; z-index: 15; display: flex; align-items: center; gap: 13px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh);
    padding: 12px 15px; margin-bottom: 16px;
  }
  .nudge.soon { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); background: var(--accent-soft); }
  .nudge.imminent { border-color: var(--now); background: var(--now-soft); }
  .nudge .count {
    flex: none; min-width: 60px; text-align: center; font-variant-numeric: tabular-nums;
    font-size: 15px; font-weight: 800; color: var(--accent-ink); line-height: 1.1;
  }
  .nudge.imminent .count { color: var(--now); }
  .nudge .count .unit { display: block; font-size: 9.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-top: 2px; }
  .nudge .divr { flex: none; width: 1px; align-self: stretch; background: var(--line); }
  .nudge .ntitle { font-size: 14.5px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
  .nudge .nprep { font-size: 12.5px; margin-top: 3px; line-height: 1.45; }
  .nudge .nprep.owe { color: var(--owe); font-weight: 600; }
  .nudge .nprep.left { color: var(--ink-2); }
  .nudge .nbody { min-width: 0; flex: 1; }
  .nudge .nbody .ntitle .title-txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .notify-note { font-size: 11.5px; color: var(--ink-3); margin: -8px 0 14px; }
  .brief {
    margin: 16px 0 18px; font-size: 16px; line-height: 1.45; color: var(--ink-2); font-weight: 500;
  }
  .brief b { color: var(--ink); font-weight: 750; }
  .brief .accent { color: var(--accent-ink); }

  /* ---- Day nav ---- */
  .daynav { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .daynav .dlabel { font-size: 13px; font-weight: 750; letter-spacing: .01em; }
  .daynav .dlabel .sub { color: var(--ink-3); font-weight: 500; margin-left: 6px; }
  .nav-btn {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
    width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 15px; line-height: 1;
    display: grid; place-items: center;
  }
  .nav-btn:hover { border-color: var(--ink-3); color: var(--ink); }
  .today-btn {
    margin-left: auto; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
    height: 32px; padding: 0 12px; border-radius: 8px; cursor: pointer; font-size: 12.5px; font-weight: 650;
  }
  .today-btn:hover { border-color: var(--ink-3); color: var(--ink); }
  .today-btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ---- Agenda ---- */
  .agenda { position: relative; }
  .nowdiv { display: flex; align-items: center; gap: 10px; margin: 6px 0 10px; }
  .nowdiv .lab {
    font-size: 11px; font-weight: 800; letter-spacing: .06em; color: var(--now);
    background: var(--now-soft); border-radius: 999px; padding: 3px 9px; font-variant-numeric: tabular-nums;
  }
  .nowdiv .rule { flex: 1; height: 2px; background: var(--now); opacity: .55; border-radius: 2px; }

  .mtg {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
    box-shadow: var(--sh); margin-bottom: 10px; overflow: hidden; transition: border-color .15s;
  }
  .mtg.next { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .mtg.nowm { border-color: color-mix(in srgb, var(--now) 50%, var(--line)); }
  .mtg.past .mhead { opacity: .72; }
  .mhead {
    display: flex; align-items: center; gap: 12px; padding: 13px 15px; cursor: pointer; position: relative;
  }
  .mtg.next .mhead::before, .mtg.nowm .mhead::before {
    content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0;
    background: var(--accent);
  }
  .mtg.nowm .mhead::before { background: var(--now); }
  .mtime {
    flex: none; width: 58px; text-align: right; font-variant-numeric: tabular-nums;
  }
  .mtime .t { font-size: 14px; font-weight: 750; }
  .mtime .t .ap { font-size: 10px; font-weight: 700; color: var(--ink-3); margin-left: 1px; }
  .mtime .dur { font-size: 10.5px; color: var(--ink-3); }
  .mbar { flex: none; width: 3px; align-self: stretch; border-radius: 2px; background: var(--accent); min-height: 30px; }
  .mbody { flex: 1; min-width: 0; }
  .mtitle { font-size: 15px; font-weight: 650; letter-spacing: -.005em; display: flex; align-items: center; gap: 8px; }
  .mtitle .title-txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sbadge {
    flex: none; font-size: 9.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
    color: var(--accent-ink); background: var(--accent-soft); border-radius: 5px; padding: 2px 6px;
  }
  .msub { font-size: 12px; color: var(--ink-3); margin-top: 2px; display: flex; align-items: center; gap: 8px; }
  .msub .pill { display: inline-flex; align-items: center; gap: 4px; }
  .msub .owe-cue { color: var(--owe); font-weight: 650; }
  .msub .thread-cue { color: var(--accent-ink); font-weight: 600; }
  .chev { flex: none; color: var(--ink-3); font-size: 12px; transition: transform .15s; }
  .mtg.open .chev { transform: rotate(90deg); }
  .state {
    flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;
    font-size: 11px; font-weight: 900;
  }
  .state.done { background: var(--done); color: #fff; }
  .state.ghost { border: 2px dashed var(--line); color: transparent; }

  .mdetail { padding: 0 15px 15px; border-top: 1px solid var(--line-2); margin-top: -1px; }
  .mdetail.pad { padding-top: 14px; }

  /* leftoff / owe / items (shared with detail) */
  .leftoff { border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 var(--r-sm) var(--r-sm) 0; padding: 11px 13px; margin-bottom: 12px; }
  .leftoff .k { font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); margin-bottom: 4px; }
  .leftoff .v { font-size: 14px; color: var(--ink); line-height: 1.5; }
  .blk-k { font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin: 2px 0 7px; }
  .blk-k.owe { color: var(--owe); } .blk-k.neutral { color: var(--ink-3); }
  ul.items { list-style: none; margin: 0 0 4px; padding: 0; }
  ul.items li { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line-2); font-size: 13.5px; }
  ul.items li:first-child { border-top: none; }
  ul.items.plain li { color: var(--ink-2); }
  .chk {
    flex: none; width: 18px; height: 18px; border-radius: 6px; border: 2px solid var(--ink-3); margin-top: 1px;
    cursor: pointer; display: grid; place-items: center; color: transparent; font-size: 11px; font-weight: 900;
    background: var(--surface); transition: all .12s;
  }
  .chk.on { background: var(--done); border-color: var(--done); color: #fff; }
  li.done .txt { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--done); }
  .owe-tag { flex: none; font-size: 9px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--owe); background: var(--owe-soft); border-radius: 5px; padding: 2px 5px; margin-top: 2px; }
  .empty-note { font-size: 12.5px; color: var(--ink-3); padding: 2px 0 4px; }

  /* distill flow */
  textarea {
    width: 100%; border: 1.5px solid var(--line); border-radius: var(--r-sm); background: var(--bg); color: var(--ink);
    font: 12.5px/1.5 ui-monospace, "SF Mono", Menlo, monospace; padding: 10px 11px; resize: vertical; outline: none; min-height: 84px;
  }
  textarea:focus { border-color: var(--accent); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 9px; }
  .btn {
    border: none; border-radius: var(--r-sm); padding: 0 15px; min-height: 38px; font-size: 13px; font-weight: 650;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: filter .12s;
  }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ghost { background: transparent; color: var(--ink-2); border: 1.5px solid var(--line); }
  .btn.ghost:hover { border-color: var(--ink-3); color: var(--ink); }
  .linkbtn { background: none; border: none; color: var(--accent-ink); font: inherit; font-size: 12px; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
  .hint { font-size: 11.5px; color: var(--ink-3); margin: 8px 0 0; line-height: 1.5; }
  .step-n { color: var(--accent-ink); font-weight: 800; }
  .flash { font-size: 12px; color: var(--done); font-weight: 650; }
  .err { font-size: 12px; color: #c0392b; font-weight: 600; margin-top: 7px; }
  .distill-cta {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 650; color: var(--accent-ink);
    cursor: pointer; background: var(--accent-soft); border: none; border-radius: var(--r-sm); padding: 7px 11px;
  }

  .day-empty { text-align: center; color: var(--ink-3); font-size: 13.5px; padding: 26px 10px; }

  /* ---- You owe section ---- */
  .owe-sec { margin-top: 26px; }
  .sec-head { font-size: 11px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); margin: 0 2px 10px; display: flex; align-items: center; gap: 8px; }
  .sec-head .count { color: var(--owe); }
  .owe-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh); padding: 6px 15px; }
  .owe-card li { font-size: 13.5px; }
  .owe-card .src { font-size: 11px; color: var(--ink-3); margin-left: auto; flex: none; align-self: center; white-space: nowrap; }
  .owe-clear { font-size: 13px; color: var(--ink-3); padding: 16px; text-align: center; }

  /* ---- Add button + sheet ---- */
  .fab {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom));
    background: var(--accent); color: #fff; border: none; border-radius: 999px; height: 48px; padding: 0 22px;
    font-size: 14.5px; font-weight: 700; cursor: pointer; box-shadow: var(--sh-lg); display: inline-flex; align-items: center; gap: 8px; z-index: 20;
  }
  .overlay { position: fixed; inset: 0; background: rgba(10,10,15,.45); display: none; align-items: flex-end; justify-content: center; z-index: 40; }
  .overlay.open { display: flex; }
  .sheet {
    background: var(--surface); width: 100%; max-width: var(--maxw); border-radius: 18px 18px 0 0;
    padding: 20px 18px calc(22px + env(safe-area-inset-bottom)); box-shadow: var(--sh-lg); max-height: 90vh; overflow: auto;
  }
  @media (min-width: 560px) { .overlay { align-items: center; } .sheet { border-radius: 18px; } }
  .sheet h3 { margin: 0 0 16px; font-size: 17px; font-weight: 750; }
  .fld { margin-bottom: 14px; }
  .fld label { display: block; font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
  .fld input, .fld select {
    width: 100%; min-height: 42px; font-size: 15px; border: 1.5px solid var(--line); border-radius: var(--r-sm);
    padding: 8px 11px; background: var(--bg); color: var(--ink); outline: none;
  }
  .fld input:focus, .fld select:focus { border-color: var(--accent); }
  .fld-row { display: flex; gap: 10px; } .fld-row .fld { flex: 1; }
  .sheet-btns { display: flex; gap: 10px; margin-top: 8px; }
  .sheet-btns .btn { flex: 1; justify-content: center; min-height: 44px; }
  .chkline { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--ink-2); font-weight: 500; text-transform: none; letter-spacing: 0; margin: -2px 0 14px; cursor: pointer; }
  .chkline input { width: auto; min-height: 0; accent-color: var(--accent); }
  .edit-del { margin: 0 0 14px; }
  .del-choices { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
  .linkbtn.danger { color: var(--now); }
  .btn.danger { background: var(--now); color: #fff; }
  .btn.danger:hover { filter: brightness(1.06); }
  .btn.sm { min-height: 32px; padding: 0 11px; font-size: 12.5px; }

  .foot { margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--ink-3); line-height: 1.6; }
  .foot b { color: var(--ink-2); } .reset { float: right; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <h1>Thread</h1><span class="dot"></span>
    <button class="bell" id="bellBtn" title="Remind me before meetings" aria-label="Meeting reminders">&#128276;</button>
    <span class="tag" id="clock">—</span>
  </div>

  <div class="brief" id="brief"></div>

  <div class="nudge" id="nudge" hidden></div>
  <div class="notify-note" id="notifyNote" hidden></div>

  <div class="daynav">
    <button class="nav-btn" id="prevDay" aria-label="Previous day">‹</button>
    <button class="nav-btn" id="nextDay" aria-label="Next day">›</button>
    <span class="dlabel" id="dayLabel"></span>
    <button class="today-btn" id="todayBtn">Today</button>
  </div>

  <div class="agenda" id="agenda"></div>

  <div class="owe-sec" id="oweSec"></div>

  <div class="foot">
    <button class="btn ghost reset" id="resetBtn" style="min-height:30px;padding:0 11px;font-size:11.5px">Reset demo</button>
    <b>Thread v2 — cockpit.</b> Today, anchored to now. Recurring meetings are threads:
    distil a transcript and the next one opens knowing where you left off. Action items carry
    forward until done. Everything stays on this device.
  </div>
</div>

<button class="fab" id="addBtn">＋ Meeting</button>

<!-- Add meeting sheet -->
<div class="overlay" id="addOverlay">
  <div class="sheet">
    <h3 id="sheetTitle">Add a meeting</h3>
    <div class="fld">
      <label>What is it?</label>
      <input type="text" id="fTitle" placeholder="e.g. 1:1 with Sam" maxlength="80">
    </div>
    <div class="fld-row">
      <div class="fld"><label>Date</label><input type="date" id="fDate"></div>
      <div class="fld"><label>Start</label><input type="time" id="fStart" step="300" value="09:00"></div>
    </div>
    <div class="fld-row">
      <div class="fld"><label>Length</label>
        <select id="fDur"><option value="15">15 min</option><option value="30" selected>30 min</option><option value="45">45 min</option><option value="60">1 hour</option><option value="90">1.5 hours</option></select>
      </div>
      <div class="fld" id="repeatFld"><label>Repeat</label>
        <select id="fRepeat"><option value="none">Doesn't repeat</option><option value="weekly" selected>Weekly</option><option value="daily">Every weekday</option></select>
      </div>
    </div>
    <p class="hint" id="repeatHint"></p>
    <label class="chkline" id="scopeRow" hidden><input type="checkbox" id="fScope"><span id="scopeText"></span></label>
    <div class="edit-del" id="delWrap" hidden>
      <button class="linkbtn danger" id="delStart">Delete…</button>
      <span class="del-choices" id="delChoices" hidden>Delete
        <button class="btn danger sm" id="delOne">this meeting</button>
        <button class="btn danger sm" id="delSeries">entire series</button>
        <button class="linkbtn" id="delCancel">keep it</button>
      </span>
    </div>
    <div class="err" id="addErr" style="display:none"></div>
    <div class="sheet-btns">
      <button class="btn ghost" id="addCancel">Cancel</button>
      <button class="btn primary" id="addSave">Add</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var KEY = 'thread-cockpit-v1';
  var ME = 'Angela';
  var NUDGE_LEAD = 15; // minutes before a meeting that the nudge/notification fires
  var notifyOn = false;
  var notified = {};
  try { notifyOn = localStorage.getItem('thread-notify') === '1'; } catch (e) {}
  try { notified = JSON.parse(localStorage.getItem('thread-notified')) || {}; } catch (e) {}

  // ---------- date / time helpers ----------
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function parseIso(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function todayIso() { return iso(new Date()); }
  function nowMin() { var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
  function fmtClock(min) {
    var h = Math.floor(min / 60), m = min % 60, ap = h >= 12 ? 'PM' : 'AM', h12 = h % 12 || 12;
    return { t: h12 + (m ? ':' + String(m).padStart(2, '0') : ''), ap: ap };
  }
  function fmtDur(min) { if (min % 60 === 0) return (min / 60) + 'h'; if (min < 60) return min + 'm'; return Math.floor(min / 60) + 'h' + (min % 60); }
  function timeToMin(v) { var m = /^(\d{1,2}):(\d{2})$/.exec(v || ''); return m ? (+m[1]) * 60 + (+m[2]) : null; }
  function minToTime(min) { return String(Math.floor(min / 60)).padStart(2, '0') + ':' + String(min % 60).padStart(2, '0'); }
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

  // ---------- sample content ----------
  var SAMPLE_TRANSCRIPT =
    ME + ": Thanks for making time, Sam. Let's start with the budget question from last week.\n" +
    "Sam: We've got about 12k left in the Q4 line, but marketing wants half of it.\n" +
    ME + ": I want to hold firm on the platform migration spend. Can you push back on marketing?\n" +
    "Sam: I can. I'll send them the revised allocation by Thursday.\n" +
    ME + ": Good. The design review deck — I still owe you that, I'll get it to you before Friday's review.\n" +
    ME + ": And we agreed to move the NYC expansion kickoff to the 15th, yes?\n" +
    "Sam: Correct, the 15th. I'll update the invite.\n" +
    ME + ": Last thing — I need to loop Ian in on the reporting standardization. I'll set that up.\n" +
    "Sam: Sounds good. Same time next week?";
  var SAMPLE_REPLY = JSON.stringify({
    summary: "You held firm on the platform-migration spend and still owe Sam the design review deck before Friday's review.",
    decisions: ["Protect platform-migration budget; marketing gets no extra from the Q4 line", "NYC expansion kickoff moves to the 15th"],
    action_items: ["Send Sam the design review deck before Friday's review", "Loop Ian in on the reporting standardization"]
  }, null, 2);

  var COLORS = ['#4f46e5', '#0d9488', '#be185d', '#b45309', '#2563eb', '#7c3aed'];

  function load() { try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && s.meetings) return s; } catch (e) {} return seed(); }

    if (!title) { err.style.display = ''; err.textContent = 'Give the meeting a name.'; return; }
    var start = timeToMin($('fStart').value);
    if (start == null) { err.style.display = ''; err.textContent = 'Pick a start time.'; return; }
    var dur = +$('fDur').value, date = $('fDate').value || viewed;

    if (editingId) {
      var m = state.meetings.filter(function (x) { return x.id === editingId; })[0];
      if (!m) { addOverlay.classList.remove('open'); return; }
      if (m.seriesId && $('fScope').checked) {
        // Apply name + time + length across the series (each instance keeps its date).
        state.meetings.forEach(function (x) { if (x.seriesId === m.seriesId) { x.title = title; x.start = start; x.dur = dur; } });
        var s = seriesById(m.seriesId); if (s) s.title = title;
        m.dateIso = date; // the one you edited can still move day
      } else {
        m.title = title; m.start = start; m.dur = dur; m.dateIso = date;
      }
      save(); addOverlay.classList.remove('open'); viewed = date; render(); return;
    }

    var repeat = $('fRepeat').value, seriesId = null;
    if (repeat !== 'none') {
      seriesId = 's' + Date.now().toString(36);
      state.series.push({ id: seriesId, title: title, cadence: repeat === 'daily' ? 'daily' : 'weekly', color: COLORS[state.series.length % COLORS.length] });
    }
    var dates = [];
    if (repeat === 'none') dates = [date];
    else if (repeat === 'weekly') { for (var i = 0; i < 8; i++) dates.push(iso(addDays(parseIso(date), i * 7))); }
    else { var d = parseIso(date), added = 0; while (added < 10) { var dow = d.getDay(); if (dow !== 0 && dow !== 6) { dates.push(iso(d)); added++; } d = addDays(d, 1); } }
    dates.forEach(function (dt) {
      state.meetings.push({ id: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), seriesId: seriesId, title: title, dateIso: dt, start: start, dur: dur, transcript: '', thread: null, draftReply: '', showReply: false, expanded: false });
    });
    save(); addOverlay.classList.remove('open'); viewed = date; render();
  };

  // delete flow
  $('delStart').onclick = function () { $('delStart').hidden = true; $('delChoices').hidden = false; };
  $('delCancel').onclick = function () { $('delChoices').hidden = true; $('delStart').hidden = false; };
  $('delOne').onclick = function () {
    state.meetings = state.meetings.filter(function (x) { return x.id !== editingId; });
    save(); addOverlay.classList.remove('open'); render();
  };
  $('delSeries').onclick = function () {
    var m = state.meetings.filter(function (x) { return x.id === editingId; })[0];
    if (m && m.seriesId) {
      var sid = m.seriesId;
      state.meetings = state.meetings.filter(function (x) { return x.seriesId !== sid; });
      state.series = state.series.filter(function (s) { return s.id !== sid; });
    }
    save(); addOverlay.classList.remove('open'); render();
  };

  document.getElementById('resetBtn').onclick = function () { if (confirm('Reset the demo to its starting state?')) { state = seed(); viewed = todayIso(); save(); render(); } };

  // ---------- reminders ----------
  var hasNotif = typeof Notification !== 'undefined';
  function updateBell() {
    var b = $('bellBtn'); b.classList.toggle('on', notifyOn && hasNotif && Notification.permission === 'granted');
    var note = $('notifyNote');
    if (notifyOn && hasNotif && Notification.permission === 'denied') { note.hidden = false; note.textContent = 'Notifications are blocked in your browser settings — the on-screen nudge above still works.'; }
    else if (notifyOn && hasNotif && Notification.permission === 'granted') { note.hidden = false; note.textContent = 'Reminders on — a nudge ' + NUDGE_LEAD + ' min before each meeting, while Thread is open.'; }
    else { note.hidden = true; }
  }
  $('bellBtn').onclick = function () {
    if (!hasNotif) { var note = $('notifyNote'); note.hidden = false; note.textContent = 'This browser doesn’t support notifications — the on-screen nudge still works.'; return; }
    if (notifyOn) { notifyOn = false; try { localStorage.setItem('thread-notify', '0'); } catch (e) {} updateBell(); return; }
    Notification.requestPermission().then(function (p) {
      notifyOn = (p === 'granted'); try { localStorage.setItem('thread-notify', notifyOn ? '1' : '0'); } catch (e) {}
      updateBell();
      if (p === 'denied') { var note = $('notifyNote'); note.hidden = false; note.textContent = 'Notifications are blocked — allow them in your browser’s site settings. The on-screen nudge above still works.'; }
    });
  };
  function maybeNotify() {
    if (!notifyOn || !hasNotif || Notification.permission !== 'granted') return;
    var td = todayIso(), mins = nowMin();
    state.meetings.forEach(function (m) {
      if (m.dateIso !== td) return;
      var until = m.start - mins;
      if (until <= NUDGE_LEAD && until >= 0 && !notified[m.id]) {
        notified[m.id] = 1; try { localStorage.setItem('thread-notified', JSON.stringify(notified)); } catch (e) {}
        var pt = priorThreadFor(m), owe = pt ? pt.thread.items.filter(function (x) { return !x.done; }) : [];
        var body = owe.length ? 'You owe: ' + owe.map(function (x) { return x.text; }).join('; ') : (pt && pt.thread.summary ? 'Last time: ' + pt.thread.summary : 'Starting soon');
        try { new Notification(m.title + (until <= 0 ? ' starting now' : ' in ' + until + ' min'), { body: body, tag: 'thread-' + m.id }); } catch (e) {}
      }
    });
  }

  // ---------- live clock ----------
  function tick() {
    var d = new Date();
    document.getElementById('clock').textContent = d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    if (viewed === todayIso()) { renderBrief(); renderNudge(); } // keep the countdown honest
    maybeNotify();
  }
  updateBell();
  render(); tick(); setInterval(tick, 30000);
})();
</script>
</body>
</html>
